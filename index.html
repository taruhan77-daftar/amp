body::before{

        pointer-events: none;

        .shape-1 {
        width: 80px;
        height: 80px;

        animation: floatA 8s ease-in-out infinite;

        @keyframes floatA {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }

        @keyframes floatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-15px, 25px); }
